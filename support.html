<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Support</title>

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="support.css" rel="stylesheet" />
</head>
<body>

  <nav class="navbar navbar-expand-lg bg-dark border-bottom border-body" data-bs-theme="dark">
    <div class="container-fluid">
      <a class="navbar-brand" href="main.html">Home</a>

      <button class="navbar-toggler" type="button"
        data-bs-toggle="collapse"
        data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent"
        aria-expanded="false"
        aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>

      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item">
            <a class="nav-link" href="box.html">Box</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="basketball.html">Basketball</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="swimming.html">Swimming</a>
          </li>

          <li class="nav-item">
            <a class="nav-link" href="#">Football</a>
          </li>

          <li class="nav-item dropdown">
            <a class="nav-link dropdown-toggle" href="#" role="button" data-bs-toggle="dropdown" aria-expanded="false">
              More
            </a>
            <ul class="dropdown-menu">
              <li><a class="dropdown-item" href="#">Gambling</a></li>
              <li><a class="dropdown-item" href="support.html">Support</a></li>
              <li><hr class="dropdown-divider" /></li>
              <li><a class="dropdown-item" href="about.html">About us</a></li>
            </ul>
          </li>
        </ul>

        <div class="d-flex ms-auto align-items-center">
          <form class="d-flex me-3" role="search" action="#" method="get">
            <input class="form-control me-2" type="search" name="q" placeholder="Search" aria-label="Search" />
            <button class="btn btn-outline-success" type="submit">Search</button>
          </form>

          <a href="login.html" class="btn btn-outline-light">Log In</a>
        </div>
      </div>
    </div>
  </nav>

  <main class="container py-5">
    <div class="row justify-content-center">
      <div class="col-12 col-md-6 col-lg-5">
        <div class="card shadow-sm border-0">
          <div class="card-body p-4">
            <h3 class="text-center mb-2">Support</h3>
            <p class="text-center text-muted mb-4">Write your message and we’ll get back to you soon.</p>

            <form id="supportForm">
              <div class="mb-3">
                <label for="message" class="form-label">Your message</label>
                <textarea id="message" name="message" class="form-control" placeholder="Type your message here..." rows="4" required></textarea>
              </div>

              <button type="submit" class="btn btn-primary w-100">Get help</button>
            </form>

          </div>
        </div>
      </div>
    </div>
  </main>

  <div class="modal fade" id="receivedModal" tabindex="-1">
  <div class="modal-dialog modal-dialog-centered modal-top">
    <div class="modal-content bg-dark text-white">
      <div class="modal-header border-0">
        <h5 class="modal-title">Message received</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal"></button>
      </div>
      <div class="modal-body">
        <p>Thanks! We got your message. You’ll receive a reply within 24 hours or less.</p>
      </div>
    </div>
  </div>
</div>

  <footer class="bg-dark text-white text-center p-4 mt-5">
   ~

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
    const form = document.getElementById("supportForm");
    const modalEl = document.getElementById("receivedModal");

    form.addEventListener("submit", function (e) {
      e.preventDefault();

      const modal = new bootstrap.Modal(modalEl);
      modal.show();

      setTimeout(() => {
        window.location.href = "main.html";
      }, 3000);
    });
  </script>
</body>
</html>
